<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입 및 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #ffffff;
      padding: 35px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { text-align: center; margin-top: 0; margin-bottom: 24px; color: #222222; }
    .form-group { margin-bottom: 16px; }
    .form-group label.field-title {
      display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #444444;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="date"] {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid #cccccc; border-radius: 6px; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: #4a90e2; }
    input.input-error { border-color: #e74c3c; }
    .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; display: none; }
    .radio-group { display: flex; gap: 20px; padding-top: 4px; }
    .radio-group label { font-size: 15px; color: #333333; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    input[type="submit"], button.action-btn {
      width: 100%; background-color: #4a90e2; color: #ffffff; border: none;
      padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px;
      cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
      transition: all 0.2s ease;
    }
    input[type="submit"]:hover, button.action-btn:hover {
      background-color: #357abd; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(74, 144, 226, 0.45);
    }
    input[type="submit"]:active, button.action-btn:active {
      background-color: #2a639c; transform: translateY(1px) scale(0.98);
    }
    .switch-link {
      text-align: center; margin-top: 16px; font-size: 14px; color: #666666;
    }
    .switch-link a { color: #4a90e2; text-decoration: none; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    .welcome-box { text-align: center; line-height: 1.6; color: #222222; }
  </style>
</head>
<body>

  <!-- 1. 회원가입 화면 -->
  <div id="signup-box" class="card">
    <form onsubmit="handleSignup(event)">
      <h2>Sign Up</h2>
      <div class="form-group">
        <label class="field-title" for="username">Name</label>
        <input type="text" id="username" placeholder="이름을 입력하세요" required>
      </div>
      <div class="form-group">
        <label class="field-title" for="email">Email</label>
        <input type="email" id="email" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label class="field-title" for="password">Password</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div class="form-group">
        <label class="field-title" for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="01012345678 (숫자만 입력)" maxlength="13" inputmode="numeric" oninput="formatPhone(this)" required>
        <div id="phone-error" class="error-msg">올바른 휴대폰 번호 형식(010-XXXX-XXXX)으로 입력해 주세요.</div>
      </div>
      <div class="form-group">
        <label class="field-title" for="birthdate">Birthdate</label>
        <input type="date" id="birthdate" required>
      </div>
      <div class="form-group">
        <label class="field-title">Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
      </div>
      <input type="submit" value="Sign Up">
    </form>
    <div class="switch-link">
      이미 계정이 있으신가요? <a onclick="showBox('login-box')">로그인하기</a>
    </div>
  </div>

  <!-- 2. 로그인 화면 -->
  <div id="login-box" class="card hidden">
    <form onsubmit="handleLogin(event)">
      <h2>Login</h2>
      <div class="form-group">
        <label class="field-title" for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="가입한 이메일 입력" required>
      </div>
      <div class="form-group">
        <label class="field-title" for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="비밀번호 입력" required>
      </div>
      <input type="submit" value="Login">
    </form>
    <div class="switch-link">
      계정이 없으신가요? <a onclick="showBox('signup-box')">회원가입하기</a>
    </div>
  </div>

  <!-- 3. 로그인 성공 후 마이페이지 화면 -->
  <div id="welcome-box" class="card welcome-box hidden">
    <h2 id="welcome-title">Welcome!</h2>
    <p id="user-info"></p>
    <button class="action-btn" onclick="logout()">로그아웃</button>
  </div>

  <script>
    function showBox(boxId) {
      document.getElementById('signup-box').classList.add('hidden');
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('welcome-box').classList.add('hidden');
      document.getElementById(boxId).classList.remove('hidden');
    }

    function formatPhone(input) {
      let numbers = input.value.replace(/[^0-9]/g, '');
      if (numbers.length > 11) numbers = numbers.slice(0, 11);

      if (numbers.length < 4) input.value = numbers;
      else if (numbers.length < 8) input.value = numbers.slice(0, 3) + '-' + numbers.slice(3);
      else if (numbers.length === 10) input.value = numbers.slice(0, 3) + '-' + numbers.slice(3, 6) + '-' + numbers.slice(6);
      else input.value = numbers.slice(0, 3) + '-' + numbers.slice(3, 7) + '-' + numbers.slice(7);

      input.classList.remove('input-error');
      document.getElementById('phone-error').style.display = 'none';
    }

    // 회원가입 데이터 저장
    function handleSignup(event) {
      event.preventDefault();

      const phoneInput = document.getElementById('phone');
      const phoneRegex = /^01([0|1|6|7|8|9])-([0-9]{3,4})-([0-9]{4})$/;
      if (!phoneRegex.test(phoneInput.value)) {
        phoneInput.classList.add('input-error');
        document.getElementById('phone-error').style.display = 'block';
        phoneInput.focus();
        return;
      }

      const userData = {
        name: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        phone: phoneInput.value,
        birthdate: document.getElementById('birthdate').value,
        gender: document.querySelector('input[name="gender"]:checked').value
      };

      // 브라우저 localStorage에 회원 정보 저장
      localStorage.setItem('savedUser', JSON.stringify(userData));
      alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
      showBox('login-box');
    }

    // 로그인 검증
    function handleLogin(event) {
      event.preventDefault();

      const inputEmail = document.getElementById('login-email').value;
      const inputPassword = document.getElementById('login-password').value;
      const savedData = localStorage.getItem('savedUser');

      if (!savedData) {
        alert('가입된 회원 정보가 없습니다. 먼저 회원가입을 진행해 주세요.');
        showBox('signup-box');
        return;
      }

      const user = JSON.parse(savedData);

      if (inputEmail === user.email && inputPassword === user.password) {
        document.getElementById('welcome-title').textContent = `환영합니다, ${user.name}님!`;
        document.getElementById('user-info').innerHTML =
          `이메일: ${user.email}<br>` +
          `전화번호: ${user.phone}<br>` +
          `생년월일: ${user.birthdate} (${user.gender})`;
        showBox('welcome-box');
      } else {
        alert('이메일 또는 비밀번호가 일치하지 않습니다.');
      }
    }

    function logout() {
      document.getElementById('login-email').value = '';
      document.getElementById('login-password').value = '';
      showBox('login-box');
    }
  </script>

</body>
</html>
